<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="player-card">

    <header class="player-card">
        <h1> 👾 Player card </h1> 
        <p>Nickname: <span class="highlight">PixelMaster_99</span></p>
    </header>

    <section class="card-section bio">
        <h2>📋 Bio</h2>
        <p>Level: <strong>42</strong></p>
        <p>Class: <strong>Fire Mage</strong></p>
        <p>Guild: <strong>Knights of Pixels</strong></p>
    </section>

    <section class="card-section equipment">
        <h2>⚔️ Equipment</h2>
        <ul>
            <li>Flame Wand +5</li>
            <li>Archmage Robe</li>
            <li>Ring of Protection</li>
        </ul>
    </section>

  </main>
</body>
</html>
